# الموقع التسويقي على النطاق الرئيسي tijaracrm.com
# نظام الشركة يعمل على portal.tijaracrm.com (ملف nginx "erp")، والنطاق الرئيسي يأخذه هذا الملف.
# الـ API العام في erp-platform-backend (المنفذ 3100) — راجع DEPLOY-SIGNUP.md في مستودعه.
# مسار الشهادة مطابق لما يستخدمه provision-tenant.sh (tijaracrm.com-0001). تأكد بـ: sudo certbot certificates

server {
    listen 80;
    listen [::]:80;
    server_name tijaracrm.com www.tijaracrm.com;
    return 301 https://tijaracrm.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tijaracrm.com;
    ssl_certificate     /etc/letsencrypt/live/tijaracrm.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tijaracrm.com-0001/privkey.pem;
    return 301 https://tijaracrm.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tijaracrm.com;

    ssl_certificate     /etc/letsencrypt/live/tijaracrm.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tijaracrm.com-0001/privkey.pem;

    root /var/www/marketing-site/public;
    index index.html;
    charset utf-8;

    # رؤوس أمان
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://api.moyasar.com\")" always;
    # ابدأ بـ Report-Only واختبر الدفع (مدى/بطاقة/Apple Pay/STC Pay + 3D Secure) ثم حوّلها إلى Content-Security-Policy
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.moyasar.com https://challenges.cloudflare.com https://applepay.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.moyasar.com; font-src 'self' https://fonts.gstatic.com https://cdn.moyasar.com; img-src 'self' data: https://cdn.moyasar.com; connect-src 'self' https://api.moyasar.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://api.moyasar.com https://*.moyasar.com; form-action 'self' https://api.moyasar.com https://*.moyasar.com; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # الـ API العام فقط — لا تمرّر أي مسار آخر للـ backend من هذا النطاق
    # يكشف مسارات /api/v1/public فقط من لوحة المنصة؛ مسارات الإدارة لا تُعرض على النطاق العام
    location /api/public/ {
        proxy_pass http://127.0.0.1:3100/api/v1/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        limit_req zone=public_api burst=20 nodelay;
    }

    # الأصول الثابتة: تخزين مؤقت قصير لأن الملفات بلا بصمة في الاسم
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /assets/config.js {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # توافق مع الروابط القديمة للنظام: من يفتح tijaracrm.com/login يذهب إلى portal
    location ~ ^/(login|dashboard|app)(/.*)?$ {
        return 302 https://portal.tijaracrm.com$request_uri;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

# ضعه في http {} (مثلًا /etc/nginx/conf.d/rate-limit.conf) مرة واحدة:
# limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
